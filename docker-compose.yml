version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plate-tracking-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/plate_tracking.db
    volumes:
      - plate-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plate-tracking-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  plate-data:
    driver: local
